[package]
name = "openrelay"
version = "0.1.0"
license = "MIT"
description = "OpenRelay: simulador de comandos elétricos de código aberto"
repository = "https://github.com/jorgewattes/openrelay"
edition = "2021"

[[bin]]
name = "openrelay"
path = "src/main.rs"

[dependencies]
eframe = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
# Soft siren sound (desktop and browser).
tinyaudio = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"

# Web (GitHub Pages) build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "HtmlAnchorElement", "Location", "History", "Blob", "BlobPropertyBag", "Url"] }

[profile.release]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

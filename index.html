<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0e7c5a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="ComandoLivre: simulador livre e de código aberto de comandos elétricos, no navegador, no computador e no celular." />
    <title>ComandoLivre – simulador livre de comandos elétricos</title>
    <link data-trunk rel="icon" href="docs/logo.svg" />
    <link data-trunk rel="copy-file" href="docs/logo.svg" />
    <link data-trunk rel="rust" data-bin="comandolivre" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f4f6f8;
            color: #1f2933;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #comandolivre_canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }
        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 24px;
            text-align: center;
            background: #f4f6f8;
        }
        #loading p { max-width: 420px; line-height: 1.45; margin: 0; }
        #loading .erro { color: #ff8a80; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
        #loading a { color: #0b6bcb; }
        #loading .erro { color: #c62828; }
        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #d5dde3;
            border-top-color: #0e7c5a;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
        // Diagnóstico: se o app não iniciar, mostra o motivo em vez de uma tela vazia.
        (function () {
            function show(html) {
                var el = document.getElementById("loading");
                if (!el) {
                    el = document.createElement("div");
                    el.id = "loading";
                    document.body.appendChild(el);
                }
                el.style.display = "flex";
                el.innerHTML = html;
            }
            window.simuShowError = function (msg) {
                show('<p><b>O ComandoLivre não conseguiu abrir neste navegador.</b></p>' +
                    '<p>Tente atualizar a página ou abrir no Chrome, Edge, Firefox ou Safari atualizados ' +
                    '(fora de aplicativos como WhatsApp ou Instagram).</p>' +
                    '<p class="erro"></p>');
                document.querySelector("#loading .erro").textContent = String(msg || "");
            };
            function check() {
                var c = document.createElement("canvas");
                var ok = !!(window.WebAssembly && (c.getContext("webgl2") || c.getContext("webgl")));
                if (!window.WebAssembly) { window.simuShowError("Este navegador não suporta WebAssembly."); }
                else if (!ok) { window.simuShowError("Este navegador não permite gráficos WebGL (aceleração de hardware desligada?)."); }
                return ok;
            }
            window.addEventListener("error", function (e) {
                if (document.getElementById("loading")) window.simuShowError(e.message || e.error);
            });
            window.addEventListener("unhandledrejection", function (e) {
                if (document.getElementById("loading")) window.simuShowError(e.reason && (e.reason.message || e.reason));
            });
            window.addEventListener("DOMContentLoaded", function () {
                check();
                setTimeout(function () {
                    var el = document.getElementById("loading");
                    if (el && el.querySelector(".spinner")) {
                        el.insertAdjacentHTML("beforeend",
                            '<p>Está demorando mais que o normal… Se a página não abrir, atualize ou tente outro navegador.</p>');
                    }
                }, 20000);
            });
        })();
    </script>
</head>
<body>
    <canvas id="comandolivre_canvas"></canvas>
    <div id="loading">
        <div class="spinner"></div>
        <img src="logo.svg" width="72" height="72" alt="" />
        <p><b>ComandoLivre</b><br />simulador livre de comandos elétricos</p>
    </div>
    <noscript><p style="padding:24px">Ative o JavaScript para usar o ComandoLivre.</p></noscript>
</body>
</html>
